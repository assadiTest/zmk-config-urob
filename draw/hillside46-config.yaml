version: 1

base_layer: qwerty

hands:
  left: KEYS_L
  right: KEYS_R
  thumbs: KEYS_T

legends:
  left:
    - layer: Symbol
      corner: tl
      color: sym
    - layer: Number
      corner: tr
      color: num
    - layer: Function
      corner: bl
      color: fun

  right:
    - layer: Navigation
      corner: tl
      color: nav
    - layer: Mouse
      corner: tr
      color: mou
    - layer: Media
      corner: bl
      color: med

  thumbs:
    - layer: Navigation
      corner: tl
      color: nav
    - layer: Mouse
      corner: tr
      color: mou
    - layer: Media
      corner: bl
      color: med
    - layer: Symbol
      corner: br
      color: sym
    - layer: Number
      corner: br
      color: num
    - layer: Function
      corner: br
      color: fun

composite_legends:
  "&smart_mouse":
    marker: "__COMPOSITE_smart_mouse__"
    layout:
      direction: vertical
      cross_align: center
      gap: 1
      padding: 1
    elements:
      - type: glyph
        source: material
        name: pest_control_rodent
        size: 21
      - type: text
        value: SMART
        size: 12
        weight: bold
        width: 30
 
  "&mmv MOVE_UP":
    marker: "__COMPOSITE_mmv_move_up__"
    layout:
      direction: horizontal
      cross_align: center
      gap: 2
      padding: 1
    elements:
      - type: glyph
        source: mdi
        name: arrow-up
        size: 20
      - type: glyph
        source: material
        name: mouse
        size: 9

  "&mmv MOVE_DOWN":
    marker: "__COMPOSITE_mmv_move_down__"
    layout:
      direction: horizontal
      alignment: center
      spacing: 3
    elements:
      - type: glyph
        source: mdi
        name: arrow-down
        size: 15
      - type: glyph
        source: material
        name: mouse
        size: 13

  "&mmv MOVE_LEFT":
    marker: "__COMPOSITE_mmv_move_left__"
    layout:
      direction: horizontal
      alignment: center
      spacing: 3
    elements:
      - type: glyph
        source: mdi
        name: arrow-left
        size: 15
      - type: glyph
        source: material
        name: mouse
        size: 13

  "&mmv MOVE_RIGHT":
    marker: "__COMPOSITE_mmv_move_right__"
    layout:
      direction: horizontal
      alignment: center
      spacing: 3
    elements:
      - type: glyph
        source: mdi
        name: arrow-right
        size: 15
      - type: glyph
        source: material
        name: mouse
        size: 13

  "&msc SCRL_UP":
    marker: "__COMPOSITE_msc_scrl_up__"
    layout:
      direction: vertical
      cross_align: center
      gap: 0
      padding: 1
    elements:
      - type: glyph
        source: mdi
        name: arrow-up-bold-circle-outline
        size: 19
      - type: text
        value: SCRL
        size: 11
        weight: bold

  "&msc SCRL_DOWN":
    marker: "__COMPOSITE_msc_scrl_down__"
    layout:
      direction: horizontal
      cross_align: center
      gap: 3
      padding: 1
      max_width: 36
      max_height: 18
    elements:
      - type: glyph
        source: mdi
        name: arrow-down-bold-circle-outline
        size: 15
      - type: text
        value: SCROLL
        size: 9
        weight: bold

  "&msc SCRL_LEFT":
    marker: "__COMPOSITE_msc_scrl_left__"
    layout:
      direction: horizontal
      alignment: center
      spacing: 2
    elements:
      - type: glyph
        source: mdi
        name: arrow-left-bold-circle-outline
        size: 15
      - type: text
        value: SCROLL
        size: 8

  "&msc SCRL_RIGHT":
    marker: "__COMPOSITE_msc_scrl_right__"
    layout:
      direction: horizontal
      alignment: center
      spacing: 2
    elements:
      - type: glyph
        source: mdi
        name: arrow-right-bold-circle-outline
        size: 15
      - type: text
        value: SCROLL
        size: 8

  "&bt BT_SEL 0":
    marker: "__COMPOSITE_bt_slot_1__"
    layout:
      direction: horizontal
      cross_align: center
      gap: 1
      padding: 1
    elements:
      - type: glyph
        source: mdi
        name: bluetooth
        size: 21
      - type: text
        value: "1"
        size: 13
        weight: bold

  "&bt BT_SEL 1":
    marker: "__COMPOSITE_bt_slot_2__"
    layout:
      direction: horizontal
      cross_align: center
      gap: 1
      padding: 1
    elements:
      - type: glyph
        source: mdi
        name: bluetooth
        size: 21
      - type: text
        value: "2"
        size: 13
        weight: bold

  "&bt BT_SEL 2":
    marker: "__COMPOSITE_bt_slot_3__"
    layout:
      direction: horizontal
      cross_align: center
      gap: 1
      padding: 1
    elements:
      - type: glyph
        source: mdi
        name: bluetooth
        size: 21
      - type: text
        value: "3"
        size: 13
        weight: bold

  "&bt BT_SEL 3":
    marker: "__COMPOSITE_bt_slot_4__"
    layout:
      direction: horizontal
      cross_align: center
      gap: 1
      padding: 1
    elements:
      - type: glyph
        source: mdi
        name: bluetooth
        size: 21
      - type: text
        value: "4"
        size: 13
        weight: bold

  "&bt BT_SEL 4":
    marker: "__COMPOSITE_bt_slot_5__"
    layout:
      direction: horizontal
